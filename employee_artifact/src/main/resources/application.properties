# ===============================
# Application
# ===============================
spring.application.name=employee_artifact
server.port=8082

# ===============================
# Datadog Metrics
# ===============================
management.metrics.export.datadog.enabled=${DD_METRICS_ENABLED:false}
management.metrics.export.datadog.api-key=${DD_API_KEY:}
management.metrics.export.datadog.uri=${DD_METRICS_URI:https://api.datadoghq.com}
management.metrics.tags.service=${DD_SERVICE:employee-artifact}
management.metrics.tags.env=${DD_ENV:development}
management.metrics.tags.version=${DD_VERSION:unknown}

# ===============================
# Azure PostgreSQL Database
# ===============================server.port=8080
spring.datasource.url=jdbc:postgresql://employee-db.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=amol
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernateserver.port=8080
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000