plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '6.2.0.5505'
    id 'jacoco'
    id 'maven-publish'

}

group = 'employee_transaction'
//version = '0.0.1-SNAPSHOT'
version = providers.gradleProperty('releaseVersion')
        .orElse('0.0.1-SNAPSHOT').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}



repositories {
    mavenCentral()
}


publishing {
    publications {
        employeeArtifact(MavenPublication) {
            groupId = 'employee_transaction'
            artifactId = 'employee-artifact'
            version = project.version

            artifact(tasks.named('bootWar'))
        }
    }

    repositories {
        maven {
            name = 'nexus'
            url = uri(
                System.getenv('NEXUS_URL')
                    ?: 'http://20.175.104.105:8081/repository/maven-snapshots/'
            )

            credentials {
                username = System.getenv('NEXUS_USERNAME')
                password = System.getenv('NEXUS_PASSWORD')
            }

            allowInsecureProtocol = true
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'employee_project_employee_project_3cb1c2b0-7baf-4701-a16b-bd747a51c8bd'
        property 'sonar.projectName', 'employee_project'
        property 'sonar.host.url', 'http://20.112.234.64:9000'
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.java.test.binaries', 'build/classes/java/test'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}
