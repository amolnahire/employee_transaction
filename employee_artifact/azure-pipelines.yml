trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'employee-artifact'

steps:

  # ==========================================
  # 0. Check Workspace
  # ==========================================

  - script: |
      echo "=========================================="
      echo "Current Working Directory"
      echo "=========================================="
      pwd

      echo ""
      echo "=========================================="
      echo "Files in Current Directory"
      echo "=========================================="
      ls -lrth

      echo ""
      echo "=========================================="
      echo "Gradle Wrapper Check"
      echo "=========================================="
      ls -lrth gradlew || true

      echo ""
      echo "=========================================="
      echo "Recursive Project Structure"
      echo "=========================================="
      find . -maxdepth 2 -type f | sort

    displayName: 'Check Pipeline Workspace'


  # ==========================================
  # 1. Build Spring Boot Application
  # ==========================================

  - task: Gradle@3
    displayName: 'Build Spring Boot Application'
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: 'clean bootJar'
      publishJUnitResults: true
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '17'


  # ==========================================
  # 2. Build and Push Docker Image to ACR
  # ==========================================

  - task: Docker@2
    displayName: 'Build and Push Docker Image'
    inputs:
      command: 'buildAndPush'
      containerRegistry: '$(dockerRegistryServiceConnection)'
      repository: '$(imageRepository)'
      Dockerfile: '**/Dockerfile'
      tags: |
        latest
        $(Build.BuildId)
