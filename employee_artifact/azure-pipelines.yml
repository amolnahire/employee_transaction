
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'employee-artifact'

steps:

  # ==========================================
  # 1. Check Repository
  # ==========================================

  - script: |
      pwd
      echo "Repository contents:"
      ls -lrth

      echo "Employee artifact contents:"
      cd employee_artifact
      ls -lrth

      echo "Gradle wrapper:"
      ls -l gradlew
    displayName: 'Check Project Files'


  # ==========================================
  # 2. Build Spring Boot Application
  # ==========================================

  - script: |
      cd employee_artifact
      chmod +x gradlew
      ./gradlew clean bootJar
    displayName: 'Build Spring Boot Application'


  # ==========================================
  # 3. Build and Push Docker Image to ACR
  # ==========================================

  - task: Docker@2
    displayName: 'Build and Push Docker Image'
    inputs:
      command: 'buildAndPush'
      containerRegistry: '$(dockerRegistryServiceConnection)'
      repository: '$(imageRepository)'
      Dockerfile: 'employee_artifact/Dockerfile'
      buildContext: 'employee_artifact'
      tags: |
        latest
        $(Build.BuildId)
