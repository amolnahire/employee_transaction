```yaml
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'employee-artifact'

steps:

  # ==========================================
  # 0. Go to Spring Boot Project Directory
  # ==========================================

  - script: |
      cd employee_artifact/
      echo "Current directory:"
      pwd
      echo ""
      echo "Files:"
      ls -lrth
    displayName: 'Go to Employee Artifact Directory'


  # ==========================================
  # 1. Build Spring Boot Application
  # ==========================================

  - script: |
      cd employee_artifact/
      chmod +x gradlew
      ./gradlew clean bootJar
    displayName: 'Build Spring Boot Application'


  # ==========================================
  # 2. Build and Push Docker Image to ACR
  # ==========================================

  - task: Docker@2
    displayName: 'Build and Push Docker Image'
    inputs:
      command: 'buildAndPush'
      containerRegistry: '$(dockerRegistryServiceConnection)'
      repository: '$(imageRepository)'
      Dockerfile: 'employee_artifact/Dockerfile'
      buildContext: 'employee_artifact'
      tags: |
        latest
        $(Build.BuildId)
```

The important part is:

```yaml
- script: |
    cd employee_artifact/
    chmod +x gradlew
    ./gradlew clean bootJar
```

This avoids the previous `Gradle@3` wrapper-path problem entirely. It explicitly enters:

```text
/home/vsts/work/1/s/employee_artifact
```

and runs:

```text
./gradlew
```

using your **Gradle 9.7.1 wrapper**.

After the build succeeds, Docker uses:

```text
employee_artifact/Dockerfile
```

and pushes:

```text
employee.azurecr.io/employee-artifact:latest
```

