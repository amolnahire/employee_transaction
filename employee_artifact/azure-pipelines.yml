trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  projectDir: 'employee_artifact'
  azureServiceConnection: 'employeeregistry-service-connection'
  acrName: 'employeeregistry'
  imageRepository: 'employee-artifact'

  # AKS details
  aksResourceGroup: 'employee-resource'
  aksClusterName: 'employee-cluster-test'

steps:

  # ---------------------------------------------------------
  # 1. Check project files
  # ---------------------------------------------------------
  - script: |
      echo "Repository root: $(Build.SourcesDirectory)"
      pwd
      ls -lrth

      echo "Project directory contents:"
      ls -lrth "$(Build.SourcesDirectory)/$(projectDir)"

      echo "Gradle wrapper permissions:"
      ls -l "$(Build.SourcesDirectory)/$(projectDir)/gradlew"

      echo "AKS manifest files:"
      ls -lrth "$(Build.SourcesDirectory)/aks"
    displayName: 'Check Project Files'


  # ---------------------------------------------------------
  # 2. Build Spring Boot application
  # ---------------------------------------------------------
  - script: |
      cd "$(Build.SourcesDirectory)/$(projectDir)"

      chmod +x gradlew

      ./gradlew clean bootJar --no-daemon
    displayName: 'Build Spring Boot Application'


  # ---------------------------------------------------------
  # 3. Build and push Docker image to ACR
  # ---------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Build and Push Docker Image to ACR'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        echo "======================================"
        echo "Logging in to Azure Container Registry"
        echo "======================================"

        az acr login --name "$(acrName)"

        cd "$(Build.SourcesDirectory)/$(projectDir)"

        echo "======================================"
        echo "Building Docker image"
        echo "======================================"

        docker build \
          -t "$(acrName).azurecr.io/$(imageRepository):latest" \
          -t "$(acrName).azurecr.io/$(imageRepository):$(Build.BuildId)" \
          .

        echo "======================================"
        echo "Pushing latest image"
        echo "======================================"

        docker push \
          "$(acrName).azurecr.io/$(imageRepository):latest"

        echo "======================================"
        echo "Pushing Build ID image"
        echo "======================================"

        docker push \
          "$(acrName).azurecr.io/$(imageRepository):$(Build.BuildId)"

        echo "======================================"
        echo "Images pushed successfully"
        echo "======================================"

        echo "Latest:"
        echo "$(acrName).azurecr.io/$(imageRepository):latest"

        echo "Build ID:"
        echo "$(acrName).azurecr.io/$(imageRepository):$(Build.BuildId)"


  # ---------------------------------------------------------
  # 4. Connect to AKS and deploy
  # ---------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Deploy to AKS'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        
        echo "======================================"
        echo "Deploying to AKS"
        echo "======================================"
        
        IMAGE="$(acrName).azurecr.io/$(imageRepository):$(Build.BuildId)"
        
        echo "Deploying image:"
        echo "$IMAGE"
        
        echo "======================================"
        echo "Getting AKS credentials"
        echo "======================================"
        
        az aks get-credentials \
          --resource-group "$(aksResourceGroup)" \
          --name "$(aksClusterName)" \
          --overwrite-existing
        
        echo "======================================"
        echo "Checking AKS connection"
        echo "======================================"
        
        kubectl get nodes
        
        echo "======================================"
        echo "Applying Deployment"
        echo "======================================"
        
        kubectl apply \
          -f "$(Build.SourcesDirectory)/aks/deployment.yaml"
        
        echo "======================================"
        echo "Applying Service"
        echo "======================================"
        
        kubectl apply \
          -f "$(Build.SourcesDirectory)/aks/service.yaml"
        
        echo "======================================"
        echo "Updating Deployment Image"
        echo "======================================"
        
        kubectl set image deployment/employee-artifact \
          employee-artifact="$IMAGE"
        
        echo "======================================"
        echo "Waiting for Deployment"
        echo "======================================"
        
        kubectl rollout status \
          deployment/employee-artifact \
          --timeout=5m
        
        echo "======================================"
        echo "Deployment"
        echo "======================================"
        
        kubectl get deployment employee-artifact
        
        echo "======================================"
        echo "Pods"
        echo "======================================"
        
        kubectl get pods -o wide
        
        echo "======================================"
        echo "Service"
        echo "======================================"
        
        kubectl get service employee-artifact-service
        
        echo "======================================"
        echo "AKS deployment completed successfully"
        echo "======================================"